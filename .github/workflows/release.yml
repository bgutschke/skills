name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release without tagging or publishing anything
        type: boolean
        default: false

# semantic-release needs to push a release commit and tag straight to `main`, which is
# branch-protected (require a PR, 0 approvals). The default GITHUB_TOKEN can't do this:
# its actor (github-actions[bot]) isn't a repo collaborator, and this repo is a personal
# account, not an org, so neither classic bypass_pull_request_allowances nor a Rulesets
# Integration bypass actor is even available (both rejected by the API — org-only).
# Instead, main's branch protection has enforce_admins: false, and this workflow pushes
# authenticated as the repo owner via a PAT — add one as a repo secret named
# RELEASE_TOKEN (Settings > Secrets and variables > Actions), scoped to this repo with
# Contents/Issues/Pull requests read-write. Without it, the release step's push fails
# loudly rather than silently using an insufficient token.
permissions:
  contents: read

# Never let two release runs race over the same push to main.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires on every Validate completion, including failed ones — gate on
    # conclusion so a broken push to main never releases.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
